[meta]
name = "codex"
version = "1.0.0"
description = "OpenAI Codex CLI — coding agent for the terminal"
type = "qwert"

[check]
command = "codex"
version_flag = "--version"

[install]
all = "npm install -g @openai/codex"

[upgrade]
all = "npm update -g @openai/codex"

[uninstall]
all = "npm uninstall -g @openai/codex"