version=$(asdf latest ward 2>/dev/null || true)
if [ -n "$version" ]; then
  asdf install ward "$version" >/dev/null 2>&1 || true
  asdf global ward "$version" >/dev/null 2>&1 || true
  asdf reshim ward >/dev/null 2>&1 || true
fi
