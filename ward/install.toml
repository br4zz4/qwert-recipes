[uninstall]
macos = '''
version=$(asdf current ward 2>/dev/null | awk '{print $2}')
if [ -n "$version" ]; then
  asdf uninstall ward "$version" >/dev/null 2>&1 || true
fi
rm -f "$HOME/.asdf/shims/ward"
'''
