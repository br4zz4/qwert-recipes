to = "~/.claude"
macos = [
  "mkdir -p ~/.claude",
  "mkdir -p ~/.qwert/config/claude",
  "if [ -f ~/.claude/settings.local.json ] && [ ! -L ~/.claude/settings.local.json ] && [ ! -f ~/.qwert/config/claude/settings.local.json ]; then mv ~/.claude/settings.local.json ~/.qwert/config/claude/settings.local.json; fi",
  "touch ~/.qwert/config/claude/settings.local.json",
  "ln -sfn ~/.qwert/config/claude/settings.local.json ~/.claude/settings.local.json",
]
debian = [
  "mkdir -p ~/.claude",
  "mkdir -p ~/.qwert/config/claude",
  "if [ -f ~/.claude/settings.local.json ] && [ ! -L ~/.claude/settings.local.json ] && [ ! -f ~/.qwert/config/claude/settings.local.json ]; then mv ~/.claude/settings.local.json ~/.qwert/config/claude/settings.local.json; fi",
  "touch ~/.qwert/config/claude/settings.local.json",
  "ln -sfn ~/.qwert/config/claude/settings.local.json ~/.claude/settings.local.json",
]
arch = [
  "mkdir -p ~/.claude",
  "mkdir -p ~/.qwert/config/claude",
  "if [ -f ~/.claude/settings.local.json ] && [ ! -L ~/.claude/settings.local.json ] && [ ! -f ~/.qwert/config/claude/settings.local.json ]; then mv ~/.claude/settings.local.json ~/.qwert/config/claude/settings.local.json; fi",
  "touch ~/.qwert/config/claude/settings.local.json",
  "ln -sfn ~/.qwert/config/claude/settings.local.json ~/.claude/settings.local.json",
]

[undo]
macos = [
  "rm -f ~/.claude/settings.local.json",
]
debian = [
  "rm -f ~/.claude/settings.local.json",
]
arch = [
  "rm -f ~/.claude/settings.local.json",
]