[meta]
name = "claude"
version = "1.0.0"
description = "Anthropic Claude Code — agentic coding in the terminal"
type = "qwert"

[check]
command = "claude"
version_flag = "--version"

[install]
all = "npm install -g @anthropic-ai/claude-code"

[upgrade]
all = "npm update -g @anthropic-ai/claude-code"

[uninstall]
all = "npm uninstall -g @anthropic-ai/claude-code"